name: Build Android Release APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend API Base URL (e.g., https://grozzby-api.onrender.com)'
        required: true
        default: 'https://grozzby-api.onrender.com'
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: mobile
        run: |
          API_URL="${{ github.event.inputs.api_base_url || 'https://grozzby-api.onrender.com' }}"
          echo "Building APK pointing to: $API_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grozzby-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
